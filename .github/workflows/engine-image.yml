name: Engine image

# Verifies the cloud engine image builds on ARM64 (Oracle Ampere) and x86_64, and that /health answers.
on:
  push:
    paths: ["engine/**", ".github/workflows/engine-image.yml"]
  pull_request:
    paths: ["engine/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: engine
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (amd64)
        run: |
          docker build -t engine-test engine
          docker run -d --name engine -p 8765:8765 -e ENGINE_AUTH=none engine-test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health; then exit 0; fi
            sleep 2
          done
          docker logs engine
          exit 1
